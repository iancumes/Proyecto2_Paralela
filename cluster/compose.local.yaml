# Ensayo virtual: dos contenedores en UNA computadora. No es el cluster fisico.
name: proyecto2-ensayo
services:
  master:
    image: mpi-cluster-image
    hostname: p2-master
    networks: [ensayo]
    cpus: 2
  worker:
    image: mpi-cluster-image
    hostname: p2-worker
    networks: [ensayo]
    cpus: 2
networks:
  ensayo:
    ipam:
      config:
        # Evita que Docker asigne 172.20.0.0/16, que coincide con algunos hotspots Mac.
        # Cambiar P2_ENSAYO_SUBNET si esta subred coincide con la LAN del equipo.
        - subnet: ${P2_ENSAYO_SUBNET:-192.168.240.0/24}
